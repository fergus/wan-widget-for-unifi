name: Release

# Push a tag like v0.1.0 to build the installer and open a draft release for it.
# The tag must match the version in src-tauri/Cargo.toml.
# Needs the TAURI_SIGNING_PRIVATE_KEY repository secret: the updater key that signs
# the update, matching the pubkey in tauri.conf.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match src-tauri/Cargo.toml version $version"
            exit 1
          }

      # The changelog entry becomes the release notes, so a release without one is refused.
      # scripts/prepare-release.ps1 writes the dated heading this looks for.
      - name: Read the changelog entry for this version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## ' + [regex]::Escape($version) + ' - \d{4}-\d{2}-\d{2}[ \t]*\r?\n(?<body>.*?)(?=^## |\z)'
          $m = [regex]::Match($text, $pattern)
          if (-not $m.Success) {
            Write-Error "CHANGELOG.md has no '## $version - YYYY-MM-DD' entry"
            exit 1
          }
          $body = $m.Groups['body'].Value.Trim()
          if (-not $body) {
            Write-Error "The CHANGELOG.md entry for $version is empty"
            exit 1
          }
          $delim = "NOTES_" + [guid]::NewGuid().ToString('N')
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_NOTES<<$delim"
          Add-Content -Path $env:GITHUB_ENV -Value $body
          Add-Content -Path $env:GITHUB_ENV -Value $delim

      - name: Check the updater signing key is set
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:KEY) {
            Write-Error "Add the TAURI_SIGNING_PRIVATE_KEY secret (Settings > Secrets and variables > Actions)"
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: npx --yes @tauri-apps/cli@2.12.3
          tagName: ${{ github.ref_name }}
          releaseName: WAN Widget for UniFi ${{ github.ref_name }}
          releaseBody: |
            ${{ env.RELEASE_NOTES }}

            ---

            Download the `-setup.exe` below and run it. It installs for your user only, so no admin rights are needed.

            The installer is not code-signed yet, so Windows SmartScreen may warn about it. Choose **More info**, then **Run anyway**.
          releaseDraft: true
          # The notes come from CHANGELOG.md, not from a generated list of pull requests.
          generateReleaseNotes: false
          # latest.json is what installed copies read to find and verify the update.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
