<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniFi Widget Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <form id="form" autocomplete="off">
    <h1>Settings</h1>

    <fieldset>
      <legend>Gateway</legend>
      <label>Gateway URL
        <input id="gatewayUrl" type="url" required placeholder="https://192.168.1.1">
      </label>
      <label>API key
        <input id="apiKey" type="password" autocomplete="off" spellcheck="false">
        <small id="keyHint">Create one in the UniFi Network app. It is stored in Windows Credential Manager, never in the settings file.</small>
      </label>
      <label>Site
        <input id="site" type="text" required>
      </label>
      <label class="check">
        <input id="acceptInvalidCerts" type="checkbox">
        Accept the gateway's self-signed certificate
      </label>
    </fieldset>

    <fieldset>
      <legend>Graph</legend>
      <label>Poll interval (seconds, 1 to 60)
        <input id="pollSeconds" type="text" inputmode="decimal">
      </label>
    </fieldset>

    <fieldset>
      <legend>Monthly usage</legend>
      <label>Billing day of month (1 to 31)
        <input id="billingDay" type="text" inputmode="numeric">
      </label>
      <label>Timezone (must match the controller)
        <input id="timezone" type="text" list="zones" spellcheck="false">
        <datalist id="zones"></datalist>
      </label>
    </fieldset>

    <fieldset>
      <legend>External IP</legend>
      <label class="check">
        <input id="lookupEnabled" type="checkbox">
        Look up my public IP (sends a request to the URL below)
      </label>
      <label>Lookup URL (plain-text response)
        <input id="ipLookupUrl" type="url" placeholder="https://api.ipify.org">
      </label>
    </fieldset>

    <ul id="errors" class="errors" hidden></ul>
    <p id="result" class="result" hidden></p>

    <div class="actions">
      <button type="button" id="test">Test connection</button>
      <span class="spacer"></span>
      <button type="button" id="close">Close</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
  <script type="module" src="settings.js"></script>
</body>
</html>
